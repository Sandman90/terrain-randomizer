<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrain Randomizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            text-align: center;
        }

        #grid-container {
            display: grid;
            border: 1px solid black;
            margin: 20px auto;
        }

        .grid-square {
            width: 50px;
            height: 50px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            background-color: #f0f0f0;
        }

        .active {
            background-color: #4bb24d; /* Active square color */
        }
        .selected {
            background-color: #960f6b; /* Colore per il quadrato selezionato */
        }
    </style>
</head>
<body>
<div class="container clearfix m-auto my-1">
    <div class="card float-start" style="width: 18rem;">
        <!--img src="..." class="card-img-top" alt="..."-->
        <div class="card-body">
            <h1 class="card-title">Terrain randomizer</h1>
            <p class="card-text">Select a map and randomize spawn point.</p>

            <button id="create-grid-btn" class="btn btn-primary m-1 mx-auto">Crea Griglia</button>
            <button id="randomize-btn" class="btn btn-primary m-1 mx-auto">Lancia</button>

            <div class="input-group mt-1">
                <span class="input-group-text" id="basic-addon1">Righe</span>
                <input id="rows" type="number" class="form-control" placeholder="15" value="15"
                       aria-label="Righe" aria-describedby="basic-addon1">
            </div>
            <div class="input-group mt-1">
                <span class="input-group-text" id="basic-addon2">Colonne</span>
                <input id="cols" type="number" class="form-control" placeholder="15" value="15"
                       aria-label="Colonne" aria-describedby="basic-addon2">
            </div>
        </div>
    </div>
    <div class="float-start container border-info col-2">
    </div>

    <div id="grid-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="pack.js"></script>
</body>
</html>

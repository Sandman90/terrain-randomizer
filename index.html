<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrain Randomizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="./styles/style.css" rel="stylesheet" crossorigin="anonymous" />
</head>
<body>
<div class="clearfix m-auto my-1">
    <div class="card float-start m-1 mt-0 d-print-none" style="width: 18rem;">
        <!--img src="..." class="card-img-top" alt="..."-->
        <div class="card-body">
            <h4 class="card-title">Terrain randomizer</h4>
            <p class="card-text">Select a map and randomize spawn point.</p>

            <!-- div class="input-group mt-1">
                <span class="input-group-text" id="basic-addon1">Righe</span>
                <input id="rows" type="number" class="form-control" placeholder="10" value="10"
                       aria-label="Righe" aria-describedby="basic-addon1">
            </div>
            <div class="input-group mt-1">
                <span class="input-group-text" id="basic-addon2">Colonne</span>
                <input id="cols" type="number" class="form-control" placeholder="10" value="10"
                       aria-label="Colonne" aria-describedby="basic-addon2">
            </div -->
            <div class="form-group row">
                <div class="col-7">
                    <input type="range" class="form-control-range" id="grid-range"
                           min="10" max="25" value="15">
                    <input type="range" class="form-control-range" id="grid-range-rows"
                           min="10" max="25" value="15">
                </div>
                <div class="col-5">
                    <button id="create-grid-btn" class="btn btn-primary btn-sm">Crea Griglia</button><br>
                    <label for="grid-range" id="grid-label" class="text-start">15x15</label>
                </div>
            </div>

            <hr>
            <button id="randomize-btn" class="btn btn-primary btn-lg m-1 mx-auto">Lancia</button>
            <button id="clear-btn" class="btn btn-outline-danger m-1 mx-auto">Pulisci mappa</button>

            <hr>
            <h5>Brushes...</h5>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="brush-options" id="brush-point" value="point">
                <label class="form-check-label" for="brush-point">Point</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="brush-options" id="brush-cross" value="cross" checked="checked">
                <label class="form-check-label" for="brush-cross">Cross</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="brush-options" id="brush-box" value="box">
                <label class="form-check-label" for="brush-box">Square</label>
            </div>
            <h5 class="mt-3">Sfondi...</h5>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="back-options" id="back-earth" value="earth" checked="checked">
                <label class="form-check-label" for="back-earth">Earth</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="back-options" id="back-rock" value="rock">
                <label class="form-check-label" for="back-rock">Rock</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="back-options" id="back-wood" value="wood">
                <label class="form-check-label" for="back-wood">Wood</label>
            </div>

            <hr>

            <div class="form-inline">
                <div class="input-group mb-2 mr-sm-2">
                    <!-- div class="input-group-prepend">
                        <div class="input-group-text">Label</div>
                    </div -->
                    <input type="text" class="form-control" id="map-name" placeholder="Mappa">
                    <div class="input-group-append">
                        <button id="save-btn" class="btn btn-primary">Salva</button>
                        <!-- button class="btn btn-outline-secondary" type="button" id="button-addon2">Button</button -->
                    </div>
                </div>
            </div>

            <div>
                <div class="form-group">
                    <!-- label for="exampleFormControlSelect2">Example multiple select</label -->
                    <label for="map-names"></label>
                    <select size="4" class="form-control" id="map-names"></select>
                </div>
                <button id="load-btn" class="btn btn-dark m-2 mx-auto">Carica mappa</button>
                <button id="delete-btn" class="btn btn-outline-danger m-2 mx-auto">Cancella</button>
            </div>


        </div>
    </div>

    <div class="float-start border-info col-2">
        <div id="grid-container" class="m-0"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="dist/terrain-randomizer.js"></script>
</body>
</html>
